<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ignite UI for Blazor · Open Source</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <!-- Exactly one Ignite UI theme. Lite's theme also covers Grid Lite. -->
    <link rel="stylesheet" href="_content/IgniteUI.Blazor/themes/dark/material.css" />
    <!-- Brand palette generated with the igniteui-theming MCP (create_custom_palette) -->
    <link rel="stylesheet" href="css/ig-palette.css" />
    <!-- Stock design-system palettes, scoped to the Theming slide preview -->
    <link rel="stylesheet" href="css/lab-palettes.css" />
    <link rel="stylesheet" href="css/showcase-typography.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="StandupDemo.styles.css" />
    <link rel="icon" type="image/png" href="img/ignite-ui.png" />
    <script type="importmap"></script>
</head>

<body class="ig-scrollbar">
    <div id="app">
        <div class="boot">
            <img src="img/ignite-ui.png" alt="" />
            <div class="boot-bar"><span></span></div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script type="module" src="js/templates.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
